services :
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - 54327:5432
    environment:
      - POSTGRES_PASSWORD=220947
      - POSTGRES_USER=thitinunt
      - POSTGRES_DB=thitinunt
    volumes:
      - ./data:/var/lib/postgresql/data  

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    environment:
      - PGADMIN_DEFAULT_EMAIL=mosmos1694@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=thitinunt22
    ports:
      - 8081:80
    volumes:
      - ./admin-data:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - "9091:1337"
    enviroment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=69-s1-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=thitinunt
      - DATABASE_USERNAME=thitinunt
      - DATABASE_password=220947
